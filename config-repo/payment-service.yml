server:
  port: 8006

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/payment_database

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:DEMO1234}
  hash-secret: ${VNPAY_HASH_SECRET:ABCDEFGHIJKLMNOP1234567890ABCDEF}
